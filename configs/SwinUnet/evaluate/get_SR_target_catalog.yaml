model:
  # Model specific settings, do not change!
  model: "SwinUnet"  # Should be the same name as parent config folder
  run_name: "deepSPIRE_default"  # Such that the run can be recognized, i.e., start date
  input_shape: [256, 256, 4]
  output_shape: [256, 256, 1]

sys_config:
  n_cpu_cores: 8 # Number of CPU cores to use in parallel processing

data:
  # Data specific settings, change to needs.
  test_dataset_path: "/data/datasets/shark_sides_mips_spire_noisy_120sqdeg/Test"
  target_catalog_output_dir: "/data/datasets"
  target_catalog_name: "500SR_target_catalog.fits"  # Name of the target catalog to be saved in target_catalog_output_dir
  SR_catalog_name: "500SR_SR_catalog.fits" # Name of the super-resolved catalog to be saved in the results folder of the model
  border_pixel_distance: 8  # Number of pixels from image border to exclude sources
  test_batch_size: 32 # Batch size for test data, can be larger than train batch size
  input: ["24", "250", "350", "500"]  # class names
  target: ["500SR"]  # class names
